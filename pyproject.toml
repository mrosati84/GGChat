[project]
name = "ggchat"
version = "0.1.0"
description = "A tiny room-based chat over ultrasound"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dearpygui>=2.0.0",
    "ggwave>=0.4.3",
    "nuitka>=4.1.3",
    "numpy>=2.0.0",
    "sounddevice>=0.5.0",
]

[project.scripts]
ggchat = "ggchat.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
